server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Normalize /routes -> /routes/
    location = /routes {
        return 301 /routes/;
    }

    # Serve the SPA under the /routes prefix and fall back to index.html.
    location /routes/ {
        try_files $uri $uri/ /routes/index.html;
    }
}
